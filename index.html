<!DOCTYPE html>
<html>
<head>
    <title>ResumeSense AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #141e30, #243b55);
            color: white;
        }
        .hero {
            margin-top: 120px;
        }
    </style>
</head>

<body>

<div class="container text-center hero">

    <h1 class="display-3 fw-bold">ResumeSense AI 🚀</h1>

    <form action="/analyze" method="POST" enctype="multipart/form-data" class="mt-4">
        <input class="form-control mb-3" type="file" name="resume" required>
        <button class="btn btn-warning btn-lg">Analyze Resume</button>
    </form>

    <p class="mt-4">✨ ATS Score • Skills • Jobs • AI Feedback • Projects</p>

</div>

</html>
